<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La pista del circo · Estaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1ECFF; --sky:#E4DBFF; --surface:#FFFFFF; --surface-2:#F8F5FF;
  --ink:#231B4D; --ink-soft:#5B5384; --line:#D9D0F5;
  --night:#2A1F6B; --night-ink:#FFFFFF;
  --tent-a:#E8323C; --tent-b:#FFF7EE; --gold:#FFC233;
  --shadow:0 10px 0 rgba(42,31,107,.12);
  --c:#E8323C; --c-ink:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171238; --sky:#211A4D; --surface:#2A2260; --surface-2:#231C52;
    --ink:#F5F2FF; --ink-soft:#BDB3EA; --line:#3E3480;
    --night:#0F0B29; --night-ink:#FFFFFF;
    --tent-b:#2A2260;
    --shadow:0 10px 0 rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171238; --sky:#211A4D; --surface:#2A2260; --surface-2:#231C52;
  --ink:#F5F2FF; --ink-soft:#BDB3EA; --line:#3E3480;
  --night:#0F0B29; --night-ink:#FFFFFF;
  --tent-b:#2A2260;
  --shadow:0 10px 0 rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.4;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:"Lilita One","Fredoka",system-ui,sans-serif;font-weight:400;margin:0;letter-spacing:.01em}

/* ---------- Carpa ---------- */
.tent{position:relative;background:repeating-linear-gradient(90deg,var(--tent-a) 0 46px,#FFF7EE 46px 92px);height:120px}
.tent svg{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:40px;display:block}
.tent .flag{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:64px;height:64px}
.home{max-width:980px;margin:0 auto;padding:8px 20px 40px;text-align:center}
.home h1{font-size:clamp(2.2rem,6vw,3.6rem);color:var(--ink);line-height:1.05;margin-top:6px}
.home .lead{color:var(--ink-soft);font-size:1.15rem;margin:8px 0 26px}
.ring{display:grid;grid-template-columns:1fr 64px 1fr;grid-template-rows:auto 56px auto;gap:0;align-items:center;justify-items:center}
.arrow{width:46px;height:46px;color:var(--ink-soft)}
.ticket{position:relative;width:100%;max-width:380px;border:0;border-radius:28px 28px 28px 28px;background:var(--surface);box-shadow:var(--shadow);padding:16px 18px 18px;display:flex;align-items:center;gap:14px;text-align:left;transition:transform .15s}
.ticket:hover{transform:translateY(-3px)}
.ticket:active{transform:translateY(2px)}
.ticket .char{width:118px;height:118px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%)}
.ticket .num{position:absolute;top:-12px;left:-6px;width:42px;height:42px;border-radius:50%;background:var(--c);color:var(--c-ink);display:grid;place-items:center;font-family:"Lilita One",system-ui;font-size:1.4rem;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.ticket h2{font-size:1.75rem;color:var(--c);line-height:1}
.ticket p{margin:6px 0 0;color:var(--ink-soft);font-size:1rem}
.ticket .verb{display:inline-block;margin-top:8px;background:var(--c);color:var(--c-ink);border-radius:999px;padding:3px 12px;font-weight:600;font-size:.95rem}
.homefoot{margin-top:30px;color:var(--ink-soft);font-size:.95rem}
.homefoot button{background:none;border:0;text-decoration:underline;color:var(--ink-soft)}

/* ---------- Estación ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--night);color:var(--night-ink)}
.bar-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.back{background:rgba(255,255,255,.12);border:0;border-radius:14px;padding:10px 14px;font-weight:600;color:#fff}
.bar .who{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.bar .who .mini{width:54px;height:54px;flex:none}
.bar h1{font-size:1.6rem;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sub{font-size:.95rem;opacity:.8}
.timer{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:18px;padding:5px 6px}
.timer .t{font-family:"Lilita One",system-ui;font-size:1.7rem;min-width:78px;text-align:center;color:#fff}
.timer button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:12px;width:40px;height:40px;font-size:1.1rem;font-weight:700}
.timer button.go{background:var(--gold);color:#2A1F6B}
.timer.warn .t{color:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.progress{height:8px;background:rgba(255,255,255,.15)}
.progress i{display:block;height:100%;background:var(--c);width:100%;transition:width 1s linear}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.mission{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:22px;padding:14px 18px;box-shadow:var(--shadow);border-left:10px solid var(--c);font-size:1.2rem;font-weight:500}
.rules{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.rule{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.95rem;font-weight:500}
.rule b{font-size:1.2rem}
.modes{display:flex;gap:8px;margin:18px 0 10px;flex-wrap:wrap}
.mode{border:3px solid var(--c);background:var(--surface);color:var(--ink);border-radius:18px;padding:10px 18px;font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.mode[aria-pressed="true"]{background:var(--c);color:var(--c-ink)}
.levels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.lvl{border:2px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:14px;padding:6px 14px;text-align:left;line-height:1.15}
.lvl b{display:block;font-size:1.05rem}
.lvl small{color:var(--ink-soft);font-size:.82rem}
.lvl[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface));box-shadow:inset 0 0 0 1px var(--c)}
.stage{background:var(--surface);border-radius:30px;box-shadow:var(--shadow);padding:22px;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;position:relative;overflow:hidden}
.stage::before{content:"";position:absolute;inset:auto -10% -60% -10%;height:80%;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--c) 14%,transparent),transparent 65%);pointer-events:none}

/* Ruleta */
.wheel-box{position:relative;width:min(78vw,420px);aspect-ratio:1}
.wheel{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.72,.16,1);filter:drop-shadow(0 10px 0 rgba(0,0,0,.14))}
.pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:54px;height:62px;z-index:2;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.hub{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:26%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE58A,var(--gold) 55%,#D9971A);border:6px solid #fff;display:grid;place-items:center;font-family:"Lilita One";font-size:clamp(1rem,3vw,1.4rem);color:#2A1F6B;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.big-btn{border:0;background:var(--c);color:var(--c-ink);font-family:"Lilita One",system-ui;font-size:1.7rem;border-radius:22px;padding:14px 34px;box-shadow:0 7px 0 color-mix(in srgb,var(--c) 60%,#000);position:relative;z-index:1}
.big-btn:active{transform:translateY(4px);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 60%,#000)}
.big-btn:disabled{opacity:.6}
.ghost{border:3px solid var(--c);background:transparent;color:var(--ink);font-weight:700;border-radius:18px;padding:10px 20px;font-size:1.05rem}

/* Cartas */
.card{position:relative;z-index:1;width:min(88vw,460px);min-height:330px;border-radius:28px;background:var(--surface);border:6px solid var(--c);box-shadow:0 12px 0 color-mix(in srgb,var(--c) 45%,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 24px}
.card .emo{font-size:6rem;line-height:1;filter:drop-shadow(0 6px 0 rgba(0,0,0,.12))}
.card .txt{font-size:clamp(1.35rem,3.4vw,1.9rem);font-weight:600;margin-top:14px;line-height:1.25}
.card .tag{position:absolute;top:12px;left:14px;background:var(--c);color:var(--c-ink);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.9rem}
.card.back{background:repeating-linear-gradient(45deg,var(--c) 0 22px,color-mix(in srgb,var(--c) 75%,#fff) 22px 44px);border-color:#fff}
.card.back .seal{width:150px;height:150px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.flip{animation:flip .45s ease}
@keyframes flip{0%{transform:rotateY(90deg) scale(.95)}100%{transform:none}}
.deck-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
.count{color:var(--ink-soft);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;width:100%;position:relative;z-index:1}
.mini-card{border:4px solid var(--c);background:var(--surface);border-radius:20px;padding:14px 12px;text-align:center;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 40%,transparent)}
.mini-card .emo{font-size:2.8rem;line-height:1}
.art{width:100%;background:#F3EEFF;border-radius:16px;overflow:hidden;line-height:0}
.art svg{width:100%;height:auto;display:block}
.card.has-art{width:min(92vw,560px);padding:40px 18px 22px}
.card .art.big{border-radius:20px}
.card.has-art .txt{margin-top:12px}
.mini-card .txt{font-size:1rem;font-weight:500;margin-top:6px;line-height:1.25}

/* Dado del equilibrista */
.piles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;position:relative;z-index:1}
.pile{display:flex;flex-direction:column;align-items:center;gap:10px}
.pile h3{font-size:1.25rem;color:var(--c)}
.pile .card{width:100%;min-height:210px;padding:16px}
.pile .card .emo{font-size:4rem}
.pile .card .txt{font-size:1.3rem}
.pile .chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{border:2px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:.95rem}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surface))}

/* Modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,14,60,.62);display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.modal .box{display:flex;flex-direction:column;align-items:center;gap:18px;max-height:90vh;overflow:auto}
.change{background:var(--night);color:#fff;border-radius:32px;padding:30px 34px;text-align:center;max-width:520px;box-shadow:0 14px 0 rgba(0,0,0,.3)}
.change h2{font-size:clamp(2.2rem,7vw,3.4rem);color:var(--gold)}
.change p{font-size:1.3rem;margin:10px 0 20px}
.change .next{display:flex;align-items:center;justify-content:center;gap:12px;font-family:"Lilita One";font-size:1.6rem}
.change svg.arr{width:70px;height:70px;animation:nudge 1s infinite}
@keyframes nudge{50%{transform:translateX(10px)}}

/* Editor */
.editor{background:var(--surface);color:var(--ink);border-radius:26px;padding:20px;width:min(94vw,820px);max-height:88vh;overflow:auto}
.editor h2{font-size:1.8rem;color:var(--c)}
.editor h3{font-size:1.2rem;margin:18px 0 8px}
.erow{display:flex;gap:8px;margin-bottom:6px}
.erow input{font:inherit;font-size:1rem;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface-2);color:var(--ink)}
.erow input.e{width:64px;text-align:center}
.erow input.x{flex:1;min-width:0}
.erow button{border:0;background:var(--surface-2);border-radius:12px;width:42px;font-size:1.1rem}
.eactions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;position:sticky;bottom:-20px;background:var(--surface);padding:12px 0}
.foot{margin-top:22px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--ink-soft);font-size:.95rem}
.foot button{background:none;border:0;color:var(--ink-soft);text-decoration:underline}
.note{font-size:.9rem;color:var(--ink-soft)}

@media (max-width:640px){
  .ring{grid-template-columns:1fr;grid-template-rows:none;gap:14px}
  .ring .arrow{display:none}
  .bar-in{flex-wrap:wrap}
  .timer{width:100%;justify-content:center}
  .piles{grid-template-columns:1fr}
  .ticket .char{width:96px;height:96px}
}
@media (prefers-reduced-motion: reduce){
  .wheel{transition-duration:1.2s}
  .flip,.timer.warn .t,.change svg.arr{animation:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal" hidden></div>
<script>
/* Ilustraciones de cuerpos en acción (SVG originales) */
const ILL = (() => {
const G = 150, LT = 38, UA = 22, FA = 21, TH = 26, SH = 26, HR = 15;
const SKIN = ["#F6C7A1","#D9A07B","#A8714E","#F2D2B6","#C98B62"];
const HAIR = ["#4A2512","#1F1410","#C2410C","#E0B04A","#2E1A0E"];
const PANTS = "#3B3A7A";
let U = 0;
const r1 = n => Math.round(n*10)/10;
const dir = a => { const r = a*Math.PI/180; return [Math.sin(r), Math.cos(r)]; };
const add = (p, a, l) => { const d = dir(a); return [p[0]+d[0]*l, p[1]+d[1]*l]; };
function ik(a, t, l1, l2, b){
  let dx=t[0]-a[0], dy=t[1]-a[1], d=Math.hypot(dx,dy);
  const dd=Math.max(Math.abs(l1-l2)+.5, Math.min(l1+l2-.3, d));
  const base=Math.atan2(dy,dx), k=Math.acos(Math.max(-1,Math.min(1,(l1*l1+dd*dd-l2*l2)/(2*l1*dd))));
  const ang=base+b*k, e=[a[0]+Math.cos(ang)*l1, a[1]+Math.sin(ang)*l1];
  const end=[a[0]+Math.cos(base)*dd, a[1]+Math.sin(base)*dd];
  return [e,end];
}
function limb(root, spec, l1, l2, defB){
  if(Array.isArray(spec)){ const e=add(root,spec[0],l1); return [e, add(e,spec[1],l2)]; }
  return ik(root, spec.to, l1, l2, spec.b ?? defB);
}
const P = pts => pts.map((p,i)=>(i?"L":"M")+r1(p[0])+" "+r1(p[1])).join(" ");
/* Persona: px,py pelvis; t torso (180 = arriba); la/ra brazos, ll/rl piernas */
function person(o){
  const s=o.s||0, skin=SKIN[s%SKIN.length], hair=HAIR[(o.h??s)%HAIR.length], shirt=o.shirt||"#E8323C";
  const t=o.t??180, pel=[o.px,o.py], neck=add(pel,t,LT), head=add(pel,t,LT+HR+3);
  const perp=dir(t+90);
  const shL=[neck[0]-perp[0]*3,neck[1]-perp[1]*3], shR=[neck[0]+perp[0]*3,neck[1]+perp[1]*3];
  const hipL=[pel[0]-perp[0]*6,pel[1]-perp[1]*6], hipR=[pel[0]+perp[0]*6,pel[1]+perp[1]*6];
  const [lk,lf]=limb(hipL,o.ll||[-4,-4],TH,SH,-1), [rk,rf]=limb(hipR,o.rl||[4,4],TH,SH,1);
  const [le,lw]=limb(shL,o.la||[-14,-6],UA,FA,1), [re,rw]=limb(shR,o.ra||[14,6],UA,FA,-1);
  const out="#2A1F6B", ow=.9;
  const leg=(h,k,f)=>`<path d="${P([h,k,f])}" stroke="${out}" stroke-opacity=".35" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${P([h,k,f])}" stroke="${PANTS}" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${r1(f[0])}" cy="${r1(f[1])}" r="5.5" fill="#24224F"/>`;
  const arm=(sh,e,w)=>`<path d="${P([sh,e,w])}" stroke="${out}" stroke-opacity=".3" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${P([sh,e,w])}" stroke="${skin}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${P([sh,e])}" stroke="${shirt}" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="${r1(w[0])}" cy="${r1(w[1])}" r="4.6" fill="${skin}" stroke="${out}" stroke-opacity=".3"/>`;
  const rot=180-t;
  const headSvg=`<g transform="rotate(${r1(rot)} ${r1(head[0])} ${r1(head[1])})">
   <circle cx="${r1(head[0])}" cy="${r1(head[1])}" r="${HR}" fill="${skin}" stroke="${out}" stroke-opacity=".3" stroke-width="1.2"/>
   <path d="M${r1(head[0]-HR)} ${r1(head[1]-1)} a${HR} ${HR} 0 0 1 ${2*HR} 0 q-4 -6 -10 -5 q-6 4 -16 5z" fill="${hair}"/>
   <circle cx="${r1(head[0]-4.5)}" cy="${r1(head[1]+1.5)}" r="1.9" fill="#1E1230"/><circle cx="${r1(head[0]+4.5)}" cy="${r1(head[1]+1.5)}" r="1.9" fill="#1E1230"/>
   <circle cx="${r1(head[0]-5)}" cy="${r1(head[1]+.8)}" r=".7" fill="#fff"/><circle cx="${r1(head[0]+4)}" cy="${r1(head[1]+.8)}" r=".7" fill="#fff"/>
   <path d="M${r1(head[0]-3.5)} ${r1(head[1]+6)} q3.5 3 7 0" stroke="#7A2230" stroke-width="1.5" fill="none" stroke-linecap="round"/>
   <circle cx="${r1(head[0]-8)}" cy="${r1(head[1]+5)}" r="2" fill="#FF7E8A" opacity=".5"/><circle cx="${r1(head[0]+8)}" cy="${r1(head[1]+5)}" r="2" fill="#FF7E8A" opacity=".5"/></g>`;
  const torso=`<path d="${P([pel,neck])}" stroke="${out}" stroke-opacity=".3" stroke-width="19" stroke-linecap="round"/><path d="${P([pel,neck])}" stroke="${shirt}" stroke-width="17" stroke-linecap="round"/><path d="${P([add(pel,t,-1),add(pel,t,6)])}" stroke="${PANTS}" stroke-width="17" stroke-linecap="round"/>`;
  const behindL=o.lBehind?arm(shL,le,lw):"", behindR=o.rBehind?arm(shR,re,rw):"";
  const tn=((t%360)+360)%360, headLast=Math.abs(tn-180)>45;
  const arms=`${o.lBehind?"":arm(shL,le,lw)}${o.rBehind?"":arm(shR,re,rw)}`;
  const svg=`<g opacity="${o.op??1}">${leg(hipL,lk,lf)}${leg(hipR,rk,rf)}${behindL}${behindR}${torso}${headLast?arms+headSvg:headSvg+arms}</g>`;
  return {svg, head, top:add(pel,t,LT+2*HR+3), neck, pel, lw, rw, le, re, lk, rk, lf, rf, shL, shR};
}
/* Accesorios */
const ball=(x,y,c="#FF5A5F",r=6.5)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="#2A1F6B" stroke-opacity=".35"/><circle cx="${x-r*.35}" cy="${y-r*.35}" r="${r*.32}" fill="#fff" opacity=".8"/>`;
const sack=(x,y)=>`<rect x="${x-8}" y="${y-5}" width="16" height="10" rx="4" fill="#F0A23B" stroke="#8A5310" stroke-opacity=".6"/><path d="M${x-8} ${y} h16" stroke="#C97B1E" stroke-width="1.2"/>`;
const pica=(x1,y1,x2,y2,c="#FFC233")=>`<path d="M${x1} ${y1}L${x2} ${y2}" stroke="#8A6A10" stroke-opacity=".45" stroke-width="7" stroke-linecap="round"/><path d="M${x1} ${y1}L${x2} ${y2}" stroke="${c}" stroke-width="5" stroke-linecap="round"/>`;
const hoop=(x,y,rx,ry,c="#3D8BFF",w=4)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="none" stroke="${c}" stroke-width="${w}"/>`;

  <header class="bar"><div class="bar-in">
    <button class="back" id="back" aria-label="Volver a las estaciones">◀ Estaciones</button>
    <div class="who"><span class="mini">${ch(k)}</span><div><h1>${esc(d.name)}</h1><div class="sub">Estación ${ORDER.indexOf(k)+1} · ${esc(d.verb)}</div></div></div>
    <div class="timer ${T.left<=60&&T.run?"warn":""}" id="timer" aria-label="Temporizador de la estación">
      <button id="tminus" aria-label="Quitar un minuto">−</button>
      <span class="t" id="tval">${fmt(T.left)}</span>
      <button id="tplus" aria-label="Añadir un minuto">+</button>
      <button id="tgo" class="go" aria-label="${T.run?"Pausar":"Empezar"}">${T.run?"❚❚":"▶"}</button>
      <button id="treset" aria-label="Reiniciar">↺</button>
    </div>
  </div><div class="progress"><i id="tbar" style="width:${100*T.left/T.total}%"></i></div></header>
  <main class="wrap">
    <div class="mission"><span style="font-size:2rem" aria-hidden="true">🎪</span><span>${esc(d.mission)}</span></div>
    ${d.rules?`<div class="rules" aria-label="Normas de seguridad">${d.rules.map(r=>`<span class="rule"><b aria-hidden="true">${r[0]}</b>${esc(r[1])}</span>`).join("")}</div>`:""}
    <div class="modes" role="group" aria-label="Cómo elegir el reto">
      ${[["ruleta","🎡","Ruleta"],["mazo","🃏","Mazo"],["elegir","👆","Elegir"],["inventa",d.invent[0],k==="equilibristas"?"El dado":"Inventa"]].map(m=>`<button class="mode" data-mode="${m[0]}" aria-pressed="${S.mode===m[0]}"><span aria-hidden="true">${m[1]}</span>${m[2]}</button>`).join("")}
    </div>
    ${S.mode!=="inventa"?`<div class="levels" role="group" aria-label="Nivel">${d.groups.map((gr,i)=>`<button class="lvl" data-g="${i}" aria-pressed="${i===S.g}"><b>${esc(gr.label)}</b><small>${esc(gr.hint)}</small></button>`).join("")}</div>`:""}
    <section class="stage" id="stage"></section>
    <div class="foot"><span>${S.mode==="inventa"?"":`${g.cards.length} retos en «${esc(g.label)}»`}</span><button id="edit">Editar retos</button></div>
  </main>`;
  $("#back").onclick=()=>{location.hash=""};
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;S.dpos=-1;renderStation()});
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.g=+b.dataset.g;S.dpos=-1;S.rot=0;renderStation()});
  $("#edit").onclick=openEditor;
  bindTimer();
  ({ruleta:stageWheel,mazo:stageDeck,elegir:stageGrid,inventa:stageInvent})[S.mode]();
}
function art(c,big){const svg=c[2]&&ILL.render(c[2]);return svg?`<div class="art${big?" big":""}">${svg}</div>`:`<div class="emo" aria-hidden="true">${c[0]}</div>`}
function cardHTML(c,tag,cls=""){return `<div class="card ${cls}${c[2]?" has-art":""}"><span class="tag">${esc(tag)}</span>${art(c,true)}<div class="txt">${esc(c[1])}</div></div>`}

function stageWheel(){
  const d=DATA[S.st], g=d.groups[S.g], n=g.cards.length, R=200, seg=360/n;
  const col=d.color, cols=[col,tint(col,.45),tint(col,.2),tint(col,.65)];
  const paths=g.cards.map((c,i)=>{
    const a0=(i*seg-90)*Math.PI/180,a1=((i+1)*seg-90)*Math.PI/180;
    const x0=R+R*Math.cos(a0),y0=R+R*Math.sin(a0),x1=R+R*Math.cos(a1),y1=R+R*Math.sin(a1);
    const am=((i+.5)*seg-90)*Math.PI/180, tx=R+R*.7*Math.cos(am), ty=R+R*.7*Math.sin(am);
    const fill=cols[i%(n%2&&i===n-1?3:2)+(n%2&&i===n-1?0:0)];
    return `<path d="M${R} ${R}L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}z" fill="${fill}" stroke="#fff" stroke-width="4"/>
    <text x="${tx}" y="${ty}" font-size="${n>7?38:46}" text-anchor="middle" dominant-baseline="central" transform="rotate(${(i+.5)*seg} ${tx} ${ty})">${c[0]}</text>`}).join("");
  $("#stage").innerHTML=`<div class="wheel-box">
    <svg class="pointer" viewBox="0 0 54 62" aria-hidden="true"><path d="M27 60 L4 16 A24 24 0 1 1 50 16z" fill="#FFC233" stroke="#fff" stroke-width="4"/><circle cx="27" cy="22" r="8" fill="#fff"/></svg>
    <svg class="wheel" id="wheel" viewBox="0 0 400 400" style="transform:rotate(${S.rot}deg)" role="img" aria-label="Ruleta con ${n} retos"><circle cx="200" cy="200" r="200" fill="#fff"/>${paths}</svg>
    <div class="hub" aria-hidden="true">${esc(g.label)}</div></div>
    <button class="big-btn" id="spin">¡Girar la ruleta!</button>`;
  $("#spin").onclick=()=>{
    if(S.spinning) return; S.spinning=true; $("#spin").disabled=true;
    const i=Math.floor(Math.random()*n), jitter=(Math.random()-.5)*seg*.6;
    const base=S.rot-(S.rot%360)+360*6; S.rot=base+(360-((i+.5)*seg))+jitter;
    const w=$("#wheel"); w.style.transform=`rotate(${S.rot}deg)`;
    const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(()=>{S.spinning=false;if($("#spin"))$("#spin").disabled=false;showCard(g.cards[i],g.label)}, reduce?1300:4300);
  };
}
function stageDeck(){
  const g=DATA[S.st].groups[S.g];
  if(S.dpos<0||S.deck.length!==g.cards.length){S.deck=shuffle(g.cards.map((_,i)=>i));}
  const showing=S.dpos>=0;
  $("#stage").innerHTML = showing
    ? `${cardHTML(g.cards[S.deck[S.dpos]],g.label,"flip")}<div class="deck-row"><span class="count">Carta ${S.dpos+1} de ${g.cards.length}</span><button class="big-btn" id="next">${S.dpos+1<g.cards.length?"Siguiente carta":"Barajar otra vez"}</button></div>`
    : `<div class="card back"><div class="seal">${ch(S.st)}</div></div><div class="deck-row"><button class="big-btn" id="next">Sacar carta</button></div>`;
  $("#next").onclick=()=>{ if(S.dpos+1>=g.cards.length){S.dpos=-1;S.deck=[];} else S.dpos++; stageDeck(); };
}
function stageGrid(){
  const g=DATA[S.st].groups[S.g];
  $("#stage").innerHTML=`<div class="grid">${g.cards.map((c,i)=>`<button class="mini-card" data-i="${i}">${art(c)}<div class="txt">${esc(c[1])}</div></button>`).join("")}</div>`;
  document.querySelectorAll(".mini-card").forEach(b=>b.onclick=()=>showCard(g.cards[+b.dataset.i],g.label));
}
function stageInvent(){
  const d=DATA[S.st];
  if(!d.piles){
    $("#stage").innerHTML=`<div class="card"><span class="tag">Creatividad</span><div class="emo" aria-hidden="true">${d.invent[0]}</div><div class="txt">${esc(d.invent[1])}</div><p class="note" style="font-size:1.15rem;margin:12px 0 0">${esc(d.invent[2])}</p></div>`;
    return;
  }
  const names=Object.keys(d.piles);
  $("#stage").innerHTML=`<p class="note" style="font-size:1.1rem;text-align:center;position:relative;z-index:1;margin:0">${esc(d.invent[2])}</p>
  <div class="piles">${names.map((nm,pi)=>{const it=S.pick[nm];return `<div class="pile"><h3>${esc(nm)}</h3>
    ${it?`<div class="card flip"><div class="emo" aria-hidden="true">${it[0]}</div><div class="txt">${esc(it[1])}</div></div>`:`<div class="card back"><div class="seal" style="width:90px;height:90px;font-size:2.6rem">?</div></div>`}
    <button class="ghost" data-draw="${pi}">Sacar ${esc(nm.toLowerCase())}</button>
    <div class="chips" role="group" aria-label="Elegir ${esc(nm.toLowerCase())}">${d.piles[nm].map((o,oi)=>`<button class="chip" data-p="${pi}" data-o="${oi}" aria-pressed="${it&&it[1]===o[1]}">${o[0]} ${esc(o[1])}</button>`).join("")}</div></div>`}).join("")}</div>
  <button class="big-btn" id="drawall">Sacar las tres cartas</button>`;
  const draw=pi=>{const nm=names[pi],arr=d.piles[nm];S.pick[nm]=arr[Math.floor(Math.random()*arr.length)]};
  document.querySelectorAll("[data-draw]").forEach(b=>b.onclick=()=>{draw(+b.dataset.draw);stageInvent()});
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const nm=names[+b.dataset.p];S.pick[nm]=d.piles[nm][+b.dataset.o];stageInvent()});
  $("#drawall").onclick=()=>{names.forEach((_,i)=>draw(i));stageInvent()};
}

/* ---------- Modales ---------- */
function openModal(html,onClose){const m=$("#modal");m.innerHTML=html;m.hidden=false;
  const close=()=>{m.hidden=true;m.innerHTML="";onClose&&onClose()};
  m.onclick=e=>{if(e.target===m)close()}; m.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  const f=m.querySelector("button"); f&&f.focus(); return close;}
function showCard(c,tag){openModal(`<div class="box">${cardHTML(c,tag,"flip")}<button class="big-btn" data-close>¡A practicar!</button></div>`)}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden){$("#modal").hidden=true;$("#modal").innerHTML=""}});

/* ---------- Temporizador ---------- */
function bindTimer(){
  $("#tgo").onclick=()=>{T.run?pauseT():startT()};
  $("#treset").onclick=()=>{pauseT();T.left=T.total;paintT()};
  $("#tplus").onclick=()=>{T.total=Math.min(T.total+60,1200);T.left=Math.min(T.left+60,T.total);paintT()};
  $("#tminus").onclick=()=>{T.total=Math.max(T.total-60,60);T.left=Math.min(Math.max(T.left-60,0),T.total);paintT()};
}
function paintT(){const v=$("#tval");if(!v)return;v.textContent=fmt(T.left);$("#tbar").style.width=(100*T.left/T.total)+"%";
  $("#timer").classList.toggle("warn",T.run&&T.left<=60);const g=$("#tgo");g.textContent=T.run?"❚❚":"▶";g.setAttribute("aria-label",T.run?"Pausar":"Empezar")}
function startT(){if(T.left<=0)T.left=T.total;T.run=true;clearInterval(T.id);T.id=setInterval(()=>{T.left--;if(T.left<=0){T.left=0;pauseT();changeAlert()}paintT()},1000);paintT()}
function pauseT(){T.run=false;clearInterval(T.id);paintT()}
function changeAlert(){
  const cur=S.st?ORDER.indexOf(S.st):-1;
  openModal(`<div class="change" role="alertdialog" aria-label="Cambio de estación"><h2>¡Cambio de estación!</h2>
  <p>Recoged el material y seguid la flecha.</p>
  ${cur>=0?`<div class="next">${esc(DATA[S.st].name)} <svg class="arr" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 24h30M24 10l14 14-14 14" stroke="#FFC233" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg> ${esc(DATA[ORDER[(cur+1)%4]].name)}</div>`:""}
  <button class="big-btn" data-close style="margin-top:22px;--c:#FFC233;--c-ink:#2A1F6B">Vale</button></div>`,()=>{T.left=T.total;paintT()});
}

/* ---------- Editor de retos ---------- */
function openEditor(){
  const k=S.st, d=DATA[k];
  let draft=JSON.parse(JSON.stringify(d.groups));
  const body=()=>`<div class="editor" role="dialog" aria-label="Editar retos"><h2>Editar retos · ${esc(d.name)}</h2>
  <p class="note">Los cambios se guardan en este dispositivo y navegador.</p>
  ${draft.map((g,gi)=>`<h3>${esc(g.label)}</h3>${g.cards.map((c,ci)=>`<div class="erow">${c[2]&&ILL.render(c[2])?`<span style="width:64px;flex:none" class="art">${ILL.render(c[2])}</span>`:""}<input class="e" data-g="${gi}" data-c="${ci}" data-f="0" value="${esc(c[0])}" aria-label="Icono"><input class="x" data-g="${gi}" data-c="${ci}" data-f="1" value="${esc(c[1])}" aria-label="Texto del reto"><button data-del="${gi}-${ci}" aria-label="Borrar reto">🗑</button></div>`).join("")}
  <button class="ghost" data-add="${gi}">+ Añadir reto</button>`).join("")}
  <div class="eactions"><button class="big-btn" id="esave">Guardar cambios</button><button class="ghost" data-close>Cancelar</button><button class="ghost" id="ereset">Volver a los originales</button></div></div>`;
  const wire=()=>{
    const m=$("#modal");
    m.querySelectorAll("input").forEach(inp=>inp.oninput=()=>{draft[+inp.dataset.g].cards[+inp.dataset.c][+inp.dataset.f]=inp.value});
    m.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const[gi,ci]=b.dataset.del.split("-").map(Number);if(draft[gi].cards.length>2){draft[gi].cards.splice(ci,1);rerender()}});
    m.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{draft[+b.dataset.add].cards.push(["⭐","Nuevo reto"]);rerender()});
    $("#esave").onclick=()=>{draft.forEach(g=>g.cards=g.cards.filter(c=>c[1].trim()));d.groups=draft;persist();m.hidden=true;m.innerHTML="";S.dpos=-1;S.rot=0;renderStation()};
    $("#ereset").onclick=()=>{draft=JSON.parse(JSON.stringify(DEFAULT[k].groups));rerender()};
  };
  const rerender=()=>{openModal(body());wire()};
  rerender();
}
function persist(){try{const o={};ORDER.forEach(k=>o[k]=DATA[k].groups);localStorage.setItem(STORE,JSON.stringify(o))}catch(e){}}

/* ---------- Navegación ---------- */
function route(){
  const md=$("#modal"); md.hidden=true; md.innerHTML="";
  const h=location.hash.replace("#","");
  if(ORDER.includes(h)){ if(S.st!==h){S.st=h;S.mode="ruleta";S.g=0;S.rot=0;S.dpos=-1;S.pick={};} S.view="station"; renderStation(); }
  else { S.view="home"; S.st=null; renderHome(); }
  window.scrollTo(0,0);
}
addEventListener("hashchange",route); route();
</script>
</body>
</html>
